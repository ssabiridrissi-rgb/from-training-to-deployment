name: CI déploiement

on:
  push:
    branches: [main, feature/deployment]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Installer les dépendances
        run: "pip install --require-hashes --only-binary :all: -r requirements-dev.txt"
      - name: Tests (avec un faux modèle, pas besoin du vrai)
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Faux modèle pour que l'image se construise
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-dev.txt
          python scripts/make_dummy_model.py
      - name: Construire l'image Docker
        run: docker build -f docker/Dockerfile -t sentiment-api .
      - name: Lancer le conteneur et tester /predict
        run: |
          docker run -d -p 7860:7860 --name api sentiment-api
          for i in $(seq 1 30); do curl -sf localhost:7860/health && break; sleep 2; done
          curl -sf -X POST localhost:7860/predict -H "Content-Type: application/json" \
               -d '{"text": "Ce film est magnifique"}'
